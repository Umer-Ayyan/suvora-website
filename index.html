    <style>
      /* ═══════════════════════════════════════════
         BASE
      ═══════════════════════════════════════════ */
      *, *::before, *::after { box-sizing: border-box; }

      body {
        background-color: #050510;
        color: #e2e8f0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection { background: rgba(124,92,255,0.30); color: #fff; }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #050510; }
      ::-webkit-scrollbar-thumb { background: #1e1b4b; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #7c5cff; }

      /* ═══════════════════════════════════════════
         AURORA ANIMATIONS  (GPU-only transforms)
      ═══════════════════════════════════════════ */
      @keyframes aurora-1 {
        0%,100% { transform:translate(0%,0%) scale(1);      opacity:.08; }
        25%      { transform:translate(4%,-7%) scale(1.07); opacity:.11; }
        50%      { transform:translate(-3%,5%) scale(.96);  opacity:.06; }
        75%      { transform:translate(2%,2%) scale(1.04);  opacity:.09; }
      }
      @keyframes aurora-2 {
        0%,100% { transform:translate(0%,0%) scale(1);       opacity:.06; }
        33%      { transform:translate(-6%,6%) scale(1.09);  opacity:.09; }
        66%      { transform:translate(5%,-4%) scale(.93);   opacity:.05; }
      }
      @keyframes aurora-3 {
        0%,100% { transform:translate(0%,0%) scale(1.04);   opacity:.05; }
        40%      { transform:translate(3%,-5%) scale(.91);   opacity:.08; }
        80%      { transform:translate(-2%,4%) scale(1.07);  opacity:.05; }
      }
      @keyframes aurora-4 {
        0%,100% { transform:translate(0%,0%) scale(1);       opacity:.05; }
        50%      { transform:translate(-4%,-3%) scale(1.11); opacity:.08; }
      }

      .aurora-orb {
        position:absolute;
        border-radius:50%;
        will-change:transform,opacity;
        pointer-events:none;
      }

      /* ═══════════════════════════════════════════
         CURSOR GLOW
      ═══════════════════════════════════════════ */
      #cursor-glow {
        position:fixed;
        pointer-events:none;
        z-index:9998;
        width:480px;
        height:480px;
        border-radius:50%;
        background:radial-gradient(circle, rgba(124,92,255,.045) 0%, transparent 68%);
        transform:translate(-50%,-50%);
        left:-300px; top:-300px;
        will-change:left,top;
        transition:left .12s ease,top .12s ease;
      }

      /* ═══════════════════════════════════════════
         GRAIN TEXTURE
      ═══════════════════════════════════════════ */
      #grain-overlay {
        position:fixed;
        inset:0;
        z-index:9997;
        pointer-events:none;
        opacity:.020;
        background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size:220px 220px;
      }

      /* ═══════════════════════════════════════════
         SCROLL REVEAL
      ═══════════════════════════════════════════ */
      @keyframes reveal-up {
        from { opacity:0; transform:translateY(26px); }
        to   { opacity:1; transform:translateY(0);    }
      }
      @keyframes reveal-in {
        from { opacity:0; transform:scale(.97); }
        to   { opacity:1; transform:scale(1);   }
      }

      .reveal       { opacity:0; }
      .reveal-scale { opacity:0; }

      .reveal.is-visible {
        animation:reveal-up .78s cubic-bezier(.16,1,.3,1) forwards;
      }
      .reveal-scale.is-visible {
        animation:reveal-in .65s cubic-bezier(.16,1,.3,1) forwards;
      }

      /* stagger helpers */
      .rd1.is-visible { animation-delay:.08s; }
      .rd2.is-visible { animation-delay:.16s; }
      .rd3.is-visible { animation-delay:.24s; }
      .rd4.is-visible { animation-delay:.32s; }
      .rd5.is-visible { animation-delay:.40s; }
      .rd6.is-visible { animation-delay:.48s; }

      /* ═══════════════════════════════════════════
         GLASS SURFACE SYSTEM
      ═══════════════════════════════════════════ */
      .glass {
        background:rgba(255,255,255,.025);
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        border:1px solid rgba(255,255,255,.065);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.06),
          0 20px 44px rgba(0,0,0,.30),
          0 4px 8px  rgba(0,0,0,.18);
        transition:border-color .30s ease, box-shadow .30s ease, transform .30s cubic-bezier(.16,1,.3,1);
      }
      .glass:hover {
        border-color:rgba(124,92,255,.24);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.08),
          0 24px 56px rgba(0,0,0,.36),
          0 0  36px rgba(124,92,255,.07);
        transform:translateY(-2px);
      }

      /* flat variant — hover only, no hover lift on desktop cards */
      .glass-card {
        background:rgba(255,255,255,.020);
        border:1px solid rgba(255,255,255,.065);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.05),
          0 16px 32px rgba(0,0,0,.25);
        transition:border-color .25s ease, box-shadow .25s ease, transform .25s cubic-bezier(.16,1,.3,1);
      }
      .glass-card:hover {
        border-color:rgba(124,92,255,.22);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.07),
          0 20px 48px rgba(0,0,0,.32),
          0 0  28px rgba(124,92,255,.06);
        transform:translateY(-2px);
      }

      /* ═══════════════════════════════════════════
         BUTTON SYSTEM
      ═══════════════════════════════════════════ */
      .btn-primary {
        background:linear-gradient(135deg,#7c5cff 0%,#6a48ff 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.16),
          0 4px 14px rgba(124,92,255,.30),
          0 1px 3px  rgba(0,0,0,.28);
        transition:all .22s cubic-bezier(.16,1,.3,1);
        position:relative; overflow:hidden;
      }
      .btn-primary::after {
        content:'';
        position:absolute; inset:0;
        background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.06) 100%);
      }
      .btn-primary:hover {
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.18),
          0 4px 28px rgba(124,92,255,.50),
          0 1px 3px  rgba(0,0,0,.28);
        transform:translateY(-1px) scale(1.015);
      }
      .btn-primary:active { transform:translateY(0) scale(.99); }

      .btn-ghost {
        background:rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.10);
        transition:all .22s ease;
      }
      .btn-ghost:hover {
        background:rgba(255,255,255,.07);
        border-color:rgba(255,255,255,.16);
        transform:translateY(-1px);
      }

      /* ═══════════════════════════════════════════
         SECTION LABEL CHIP
      ═══════════════════════════════════════════ */
      .section-label {
        display:inline-flex;
        align-items:center;
        gap:7px;
        padding:5px 13px;
        border-radius:100px;
        background:rgba(124,92,255,.09);
        border:1px solid rgba(124,92,255,.22);
        font-size:10.5px;
        font-weight:600;
        letter-spacing:.11em;
        text-transform:uppercase;
        color:rgba(167,148,255,.92);
        font-family:'Space Grotesk',sans-serif;
        user-select:none;
      }

      /* ═══════════════════════════════════════════
         PREMIUM INPUT
      ═══════════════════════════════════════════ */
      .p-input {
        background:rgba(255,255,255,.030);
        border:1px solid rgba(255,255,255,.09);
        color:#f1f5f9;
        border-radius:10px;
        padding:12px 16px;
        width:100%;
        font-size:.925rem;
        font-family:inherit;
        outline:none;
        transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
      }
      .p-input::placeholder { color:rgba(148,163,184,.42); }
      .p-input:focus {
        background:rgba(124,92,255,.045);
        border-color:rgba(124,92,255,.45);
        box-shadow:0 0 0 3px rgba(124,92,255,.09),0 0 20px rgba(124,92,255,.05);
      }

      /* ═══════════════════════════════════════════
         ICON SURFACE
      ═══════════════════════════════════════════ */
      .icon-surface {
        display:inline-flex;
        align-items:center;
        justify-content:center;
        width:44px; height:44px;
        border-radius:12px;
        background:rgba(124,92,255,.10);
        border:1px solid rgba(124,92,255,.18);
        flex-shrink:0;
        transition:background .2s ease, border-color .2s ease;
      }
      .group:hover .icon-surface {
        background:rgba(124,92,255,.16);
        border-color:rgba(124,92,255,.28);
      }

      /* ═══════════════════════════════════════════
         REDUCED MOTION — respect system setting
      ═══════════════════════════════════════════ */
      @media (prefers-reduced-motion:reduce) {
        .aurora-orb { animation:none!important; }
        .reveal,.reveal-scale { opacity:1!important; animation:none!important; }
        #cursor-glow { display:none!important; }
        .glass,.glass-card { transition:none!important; }
        .btn-primary,.btn-ghost { transition:none!important; }
      }
    </style>

    /* Cursor glow tracking */
    (function(){
      var glow = document.getElementById('cursor-glow');
      if(!glow) return;
      document.addEventListener('mousemove', function(e){
        glow.style.left = e.clientX + 'px';

      }, { passive:true });
